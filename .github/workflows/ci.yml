name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-model-spike:
    name: Session model spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/session-model
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/session-model/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  relay-spike:
    name: Relay spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  sample-index-spike:
    name: Sample index spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/sample-index
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/sample-index/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  sample-transfer-spike:
    name: Sample transfer spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/sample-transfer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            spikes/relay/package-lock.json
            spikes/sample-transfer/package-lock.json
      # This spike imports the relay spike, which needs its own dependencies.
      - run: npm ci
        working-directory: spikes/relay
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  plugin-inventory-spike:
    name: Plugin inventory spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/plugin-inventory
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/plugin-inventory/compare/package-lock.json
      # Needs only Steinberg's VST3 headers, not JUCE, so it builds in seconds and runs on every change.
      - name: Configure (downloads the VST3 interfaces)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build the scanner and the fake plugins
        run: cmake --build build --config Release --parallel 4
      - name: Scan the fake plugins (crashing and hanging ones included)
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: "Compare tool: install, typecheck, test"
        working-directory: spikes/plugin-inventory/compare
        run: |
          npm ci
          npm run typecheck
          npm test
      # The compare tool reads what this system's scanner just wrote: the contract between the C++ and the TypeScript.
      - name: Read this system's scan with the compare tool
        working-directory: spikes/plugin-inventory/compare
        run: npm run inventory -- summary ../build/fixtures-inventory.json

  shell-scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck --version
      - run: shellcheck spikes/relay/deploy/*.sh

  # The engine build takes minutes; everything else takes seconds. Build it only when something it uses changed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.decide.outputs.engine }}
      webview: ${{ steps.decide.outputs.webview }}
      plugins: ${{ steps.decide.outputs.plugins }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        name: Decide whether the engine toolchain, web view and plugin parameter spikes must build
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base=$PR_BASE; else base=$PUSH_BEFORE; fi
          # A new branch pushes an all-zero "before"; a force push can name a commit that is gone.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base commit to compare with, so everything builds."
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "webview=true" >> "$GITHUB_OUTPUT"
            echo "plugins=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed since $base:"
          git diff --name-only "$base" HEAD | tee "$RUNNER_TEMP/changed.txt"
          if grep -qE '^(spikes/engine-toolchain/|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed.txt"; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the engine toolchain uses changed, so it is skipped."
            echo "engine=false" >> "$GITHUB_OUTPUT"
          fi
          # The web view spike builds on the engine toolchain's CMake (cmake/EngineDependencies.cmake).
          if grep -qE '^(spikes/webview-ui/|spikes/engine-toolchain/|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed.txt"; then
            echo "webview=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the web view spike uses changed, so it is skipped."
            echo "webview=false" >> "$GITHUB_OUTPUT"
          fi
          # The plugin parameter spike also builds on the engine toolchain's CMake.
          if grep -qE '^(spikes/plugin-params/|spikes/engine-toolchain/|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed.txt"; then
            echo "plugins=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the plugin parameter spike uses changed, so it is skipped."
            echo "plugins=false" >> "$GITHUB_OUTPUT"
          fi

  engine-toolchain-spike:
    name: Engine toolchain spike (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/engine-toolchain
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Configure (downloads JUCE and Tracktion Engine)
        run: |
          start=$(date +%s)
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          echo "CONFIGURE_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Build
        run: |
          start=$(date +%s)
          cmake --build build --config Release --parallel 4
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Render and check
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: Record times
        if: always()
        run: |
          {
            echo "### Engine toolchain spike on ${{ matrix.os }}"
            echo ""
            echo "| Step | Seconds |"
            echo "| --- | --- |"
            echo "| Configure, including downloads | ${CONFIGURE_SECONDS:-failed} |"
            echo "| Build | ${BUILD_SECONDS:-failed} |"
            echo ""
            echo "Runner: $(uname -a), $(nproc 2>/dev/null || sysctl -n hw.ncpu) cores"
          } >> "$GITHUB_STEP_SUMMARY"

  webview-ui-spike:
    name: Web view UI spike (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.webview == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/webview-ui
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/webview-ui/ui/package-lock.json
      - name: "Page: install, typecheck, test and build"
        working-directory: spikes/webview-ui/ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Configure (downloads JUCE, Tracktion Engine and, on Windows, the WebView2 SDK)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Self-test (bridge contract, page serving, engine settling, seek, MIDI-change resume)
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      # Opens a window on the runner and runs a short benchmark. Runners have no GPU and
      # may not show a web view at all, so this step is informational: it records what the
      # runner's web view supports, and its result does not gate the build.
      - name: End-to-end quick benchmark (informational)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            app="build/webview_spike_artefacts/Release/CollabGod WebView Spike.exe"
          else
            app="build/webview_spike_artefacts/Release/CollabGod WebView Spike.app/Contents/MacOS/CollabGod WebView Spike"
          fi
          "$app" --simulated-audio --benchmark quick --exit-after-benchmark --report-dir "$PWD/end-to-end"
      - name: Record the end-to-end report
        if: always()
        run: |
          {
            echo "### Web view UI spike on ${{ matrix.os }}"
            echo ""
            if ls end-to-end/report-*.json >/dev/null 2>&1; then
              echo '```json'
              cat end-to-end/report-*.json
              echo '```'
              cat end-to-end/report-*.json >&2  # into the log too, where the API can read it
            else
              echo "No end-to-end report. Log:"
              echo '```'
              cat end-to-end/webview-spike.log 2>/dev/null || echo "(no log)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The sync rules alone: plain C++, seconds to build, so they run every time.
  plugin-params-rules:
    name: Plugin parameter sync rules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/plugin-params
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build-rules -DPLUGIN_PARAMS_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-rules --config Release --parallel 4
      - run: ctest --test-dir build-rules -C Release --output-on-failure --verbose

  plugin-params-spike:
    name: Plugin parameter spike (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/plugin-params
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Configure (downloads JUCE and Tracktion Engine)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build (the app, and both versions of the test VST3)
        run: cmake --build build --config Release --parallel 4
      - name: Self-tests (sync rules; three members mirroring the test VST3's parameters and state over TCP; the state probe)
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: Record the self-test
        if: always()
        run: |
          {
            echo "### Plugin parameter and state spike on ${{ matrix.os }}"
            echo ""
            echo '```'
            grep -E '^(PASS|FAIL|RATE|ECHO|STATE)' build/Testing/Temporary/LastTest.log || echo "(no self-test output)"
            echo '```'
            echo ""
            cat build/selftest-state/probe.md 2>/dev/null || echo "(no state probe report)"
          } >> "$GITHUB_STEP_SUMMARY"

  # One stable check name for branch protection to require, however many jobs exist above.
  passed:
    name: CI passed
    if: always()
    needs: [session-model-spike, relay-spike, sample-index-spike, sample-transfer-spike, plugin-inventory-spike, changes, engine-toolchain-spike, webview-ui-spike, plugin-params-rules, plugin-params-spike, shell-scripts]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: |
          test "${{ needs.session-model-spike.result }}" = "success"
          test "${{ needs.relay-spike.result }}" = "success"
          test "${{ needs.sample-index-spike.result }}" = "success"
          test "${{ needs.sample-transfer-spike.result }}" = "success"
          test "${{ needs.plugin-inventory-spike.result }}" = "success"
          test "${{ needs.shell-scripts.result }}" = "success"
          test "${{ needs.plugin-params-rules.result }}" = "success"
          # The engine build may be skipped, but only because change detection succeeded and said so.
          test "${{ needs.changes.result }}" = "success"
          engine="${{ needs.engine-toolchain-spike.result }}"
          test "$engine" = "success" || { test "$engine" = "skipped" && test "${{ needs.changes.outputs.engine }}" = "false"; }
          webview="${{ needs.webview-ui-spike.result }}"
          test "$webview" = "success" || { test "$webview" = "skipped" && test "${{ needs.changes.outputs.webview }}" = "false"; }
          plugins="${{ needs.plugin-params-spike.result }}"
          test "$plugins" = "success" || { test "$plugins" = "skipped" && test "${{ needs.changes.outputs.plugins }}" = "false"; }
