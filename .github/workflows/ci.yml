name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand from the Actions tab. There is no base commit to compare with, so every job runs.
  workflow_dispatch:
  # Weekly, every job, the same way. Spike jobs otherwise run only when a spike changed, so
  # this catches a spike that stopped building as runner images and actions moved on.
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

# The weekly run has its own group, so a merge to main does not cancel it, nor it the merge's run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

jobs:
  session-model-spike:
    name: Session model spike (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.spikes == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/session-model
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/session-model/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  relay-spike:
    name: Relay spike (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.spikes == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  sample-index-spike:
    name: Sample index spike (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.spikes == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/sample-index
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/sample-index/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  sample-transfer-spike:
    name: Sample transfer spike (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.spikes == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/sample-transfer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            spikes/relay/package-lock.json
            spikes/sample-transfer/package-lock.json
      # This spike imports the relay spike, which needs its own dependencies.
      - run: npm ci
        working-directory: spikes/relay
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  plugin-inventory-spike:
    name: Plugin inventory spike (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.spikes == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/plugin-inventory
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/plugin-inventory/compare/package-lock.json
      # Needs only Steinberg's VST3 headers, not JUCE, so it builds in seconds.
      - name: Configure (downloads the VST3 interfaces)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build the scanner and the fake plugins
        run: cmake --build build --config Release --parallel 4
      - name: Scan the fake plugins (crashing and hanging ones included)
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: "Compare tool: install, typecheck, test"
        working-directory: spikes/plugin-inventory/compare
        run: |
          npm ci
          npm run typecheck
          npm test
      # The compare tool reads what this system's scanner just wrote: the contract between the C++ and the TypeScript.
      - name: Read this system's scan with the compare tool
        working-directory: spikes/plugin-inventory/compare
        run: npm run inventory -- summary ../build/fixtures-inventory.json

  # The engine projection's TypeScript side on its own: projection, diff and contract
  # tests. The end-to-end tests through the engine skip here; the job below runs them.
  engine-projection-ts:
    name: Engine projection spike, TypeScript (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.spikes == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/engine-projection/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/engine-projection/ts/package-lock.json
      # It imports spikes/session-model/src, which has no runtime dependencies.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The product's TypeScript packages and the root build scripts, through the same
  # commands a developer runs (#19). Seconds, so it runs every time.
  workspace:
    name: TypeScript packages and build scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:ts
      - run: npm run test:ts

  shell-scripts:
    name: Shell scripts
    needs: changes
    if: needs.changes.outputs.spikes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck --version
      - run: shellcheck spikes/relay/deploy/*.sh

  # Decides which jobs must run. Spikes are throwaway and product code never imports them
  # (AGENTS.md), so their jobs run only when something under spikes/ or this workflow changed.
  # The engine builds take minutes, so each runs only when something it uses changed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.decide.outputs.engine }}
      webview: ${{ steps.decide.outputs.webview }}
      plugins: ${{ steps.decide.outputs.plugins }}
      projection: ${{ steps.decide.outputs.projection }}
      spikes: ${{ steps.decide.outputs.spikes }}
      app: ${{ steps.decide.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        name: Decide which spikes must build
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base=$PR_BASE; else base=$PUSH_BEFORE; fi
          # A new branch pushes an all-zero "before"; a force push can name a commit that is gone;
          # a manual or scheduled run has none. Each of these runs every job.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base commit to compare with, so everything builds."
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "webview=true" >> "$GITHUB_OUTPUT"
            echo "plugins=true" >> "$GITHUB_OUTPUT"
            echo "projection=true" >> "$GITHUB_OUTPUT"
            echo "spikes=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed since $base:"
          git diff --name-only "$base" HEAD | tee "$RUNNER_TEMP/changed.txt"
          if grep -qE '^(spikes/engine-toolchain/|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed.txt"; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the engine toolchain uses changed, so it is skipped."
            echo "engine=false" >> "$GITHUB_OUTPUT"
          fi
          # The web view spike builds on the engine toolchain's CMake (cmake/EngineDependencies.cmake).
          if grep -qE '^(spikes/webview-ui/|spikes/engine-toolchain/|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed.txt"; then
            echo "webview=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the web view spike uses changed, so it is skipped."
            echo "webview=false" >> "$GITHUB_OUTPUT"
          fi
          # The plugin parameter spike also builds on the engine toolchain's CMake.
          if grep -qE '^(spikes/plugin-params/|spikes/engine-toolchain/|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed.txt"; then
            echo "plugins=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the plugin parameter spike uses changed, so it is skipped."
            echo "plugins=false" >> "$GITHUB_OUTPUT"
          fi
          # The engine projection builds on the toolchain's CMake and ToneCheck, and its
          # end-to-end tests drive the session model spike.
          if grep -qE '^(spikes/engine-projection/|spikes/engine-toolchain/|spikes/session-model/src/|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed.txt"; then
            echo "projection=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the engine projection spike uses changed, so it is skipped."
            echo "projection=false" >> "$GITHUB_OUTPUT"
          fi
          # The quick spike jobs: any spike, since some import others (sample-transfer imports
          # relay, engine-projection imports session-model).
          if grep -qE '^(spikes/|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed.txt"; then
            echo "spikes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No spike changed, so the spike jobs are skipped."
            echo "spikes=false" >> "$GITHUB_OUTPUT"
          fi
          # The app: its C++, the root CMake and the root build scripts that drive it.
          if grep -qE '^(app/|cmake/|CMakeLists\.txt$|scripts/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed.txt"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the app's C++ build uses changed, so it is skipped."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  engine-toolchain-spike:
    name: Engine toolchain spike (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/engine-toolchain
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Configure (downloads JUCE and Tracktion Engine)
        run: |
          start=$(date +%s)
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          echo "CONFIGURE_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Build
        run: |
          start=$(date +%s)
          cmake --build build --config Release --parallel 4
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Render and check
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: Record times
        if: always()
        run: |
          {
            echo "### Engine toolchain spike on ${{ matrix.os }}"
            echo ""
            echo "| Step | Seconds |"
            echo "| --- | --- |"
            echo "| Configure, including downloads | ${CONFIGURE_SECONDS:-failed} |"
            echo "| Build | ${BUILD_SECONDS:-failed} |"
            echo ""
            echo "Runner: $(uname -a), $(nproc 2>/dev/null || sysctl -n hw.ncpu) cores"
          } >> "$GITHUB_STEP_SUMMARY"

  webview-ui-spike:
    name: Web view UI spike (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.webview == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/webview-ui
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/webview-ui/ui/package-lock.json
      - name: "Page: install, typecheck, test and build"
        working-directory: spikes/webview-ui/ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Configure (downloads JUCE, Tracktion Engine and, on Windows, the WebView2 SDK)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Self-test (bridge contract, page serving, engine settling, seek, MIDI-change resume)
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      # Opens a window on the runner and runs a short benchmark. Runners have no GPU and
      # may not show a web view at all, so this step is informational: it records what the
      # runner's web view supports, and its result does not gate the build.
      - name: End-to-end quick benchmark (informational)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            app="build/webview_spike_artefacts/Release/CollabGod WebView Spike.exe"
          else
            app="build/webview_spike_artefacts/Release/CollabGod WebView Spike.app/Contents/MacOS/CollabGod WebView Spike"
          fi
          "$app" --simulated-audio --benchmark quick --exit-after-benchmark --report-dir "$PWD/end-to-end"
      - name: Record the end-to-end report
        if: always()
        run: |
          {
            echo "### Web view UI spike on ${{ matrix.os }}"
            echo ""
            if ls end-to-end/report-*.json >/dev/null 2>&1; then
              echo '```json'
              cat end-to-end/report-*.json
              echo '```'
              cat end-to-end/report-*.json >&2  # into the log too, where the API can read it
            else
              echo "No end-to-end report. Log:"
              echo '```'
              cat end-to-end/webview-spike.log 2>/dev/null || echo "(no log)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The sync rules alone: plain C++, seconds to build, so they run whenever a spike changed.
  plugin-params-rules:
    name: Plugin parameter sync rules (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.spikes == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/plugin-params
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build-rules -DPLUGIN_PARAMS_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-rules --config Release --parallel 4
      - run: ctest --test-dir build-rules -C Release --output-on-failure --verbose

  plugin-params-spike:
    name: Plugin parameter spike (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/plugin-params
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Configure (downloads JUCE and Tracktion Engine)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build (the app, and both versions of the test VST3)
        run: cmake --build build --config Release --parallel 4
      - name: Self-tests (sync rules; three members mirroring the test VST3's parameters and state over TCP; the state probe)
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: Record the self-test
        if: always()
        run: |
          {
            echo "### Plugin parameter and state spike on ${{ matrix.os }}"
            echo ""
            echo '```'
            grep -E '^(PASS|FAIL|RATE|ECHO|STATE)' build/Testing/Temporary/LastTest.log || echo "(no self-test output)"
            echo '```'
            echo ""
            cat build/selftest-state/probe.md 2>/dev/null || echo "(no state probe report)"
          } >> "$GITHUB_STEP_SUMMARY"

  engine-projection-spike:
    name: Engine projection spike (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.projection == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/engine-projection
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/engine-projection/ts/package-lock.json
      - name: Configure (downloads JUCE and Tracktion Engine)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Self-test (contract, edits during playback, edit storm, rebuild while playing)
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: End-to-end tests through the engine
        working-directory: spikes/engine-projection/ts
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export ENGINE_PROJECTION_BIN="$GITHUB_WORKSPACE/spikes/engine-projection/build/engine_projection_artefacts/Release/engine_projection.exe"
          else
            export ENGINE_PROJECTION_BIN="$GITHUB_WORKSPACE/spikes/engine-projection/build/engine_projection_artefacts/Release/engine_projection"
          fi
          npm ci
          npx vitest run test/engine.e2e.test.ts --silent=false
      # Informational: what an edit costs on the runner, in the job summary. Runners are
      # shared and noisy, so the numbers are for comparison, not a pass or fail.
      - name: Bench (informational)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bin=build/engine_projection_artefacts/Release/engine_projection.exe; else bin=build/engine_projection_artefacts/Release/engine_projection; fi
          {
            echo "### Engine projection bench on ${{ matrix.os }}"
            echo ""
            "$bin" bench --out bench
            echo ""
            "$bin" bench --out bench --tracktion-wave-nodes
          } >> "$GITHUB_STEP_SUMMARY"

  # The app, built and tested with the one command each that a developer uses (#19).
  # The cold build takes minutes, so it runs only when something it uses changed.
  # Caching and the rest of the app's CI come with #20.
  app:
    name: App (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build everything (downloads JUCE, Tracktion Engine and, on Windows, the WebView2 SDK)
        run: |
          start=$(date +%s)
          npm run build
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
        shell: bash
      - name: Run every test
        run: npm test
      - name: Record times
        if: always()
        shell: bash
        run: |
          {
            echo "### App on ${{ matrix.os }}"
            echo ""
            echo "Cold build, including downloads: ${BUILD_SECONDS:-failed} s"
            echo ""
            echo "Runner: $(uname -a), $(nproc 2>/dev/null || sysctl -n hw.ncpu) cores"
          } >> "$GITHUB_STEP_SUMMARY"

  # The Mac we test on stops at macOS 13.7, so its compiler is Apple clang 15, which
  # lacks C++20 parenthesised aggregate initialisation. cmake/TracktionPatches.cmake
  # works around Tracktion Engine's two uses of it. GitHub's Mac runners all have a
  # newer Xcode (macOS 14 runners, the last with Xcode 15, were retired on 2026-11-02),
  # so they never exercise the patches. Open-source clang 15 lacks the same feature
  # (it arrived in clang 16), so building with it fails if a patch stops working or
  # Tracktion starts using the feature somewhere new. It is a stand-in: Apple clang
  # differs in other ways, so the Intel MacBook stays the real test.
  app-clang-15:
    name: App with clang 15 (stand-in for Apple clang 15)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    # A plain Ubuntu 24.04 container, not the runner itself: the runner also has
    # GCC 14, and clang 15 picks GCC 14's C++ library, which it cannot compile
    # (<ranges>, <format>). In the container clang 15 uses GCC 13's, as on Ubuntu
    # 24.04 by default. Pinned, not -latest, so clang 15 stays installable.
    container: ubuntu:24.04
    env:
      CC: clang-15
      CXX: clang++-15
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install clang 15, the build tools and JUCE's Linux dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake make \
            clang-15 libstdc++-13-dev \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libglu1-mesa-dev mesa-common-dev ladspa-sdk xvfb xauth
          clang++-15 --version
          ls /usr/lib/gcc/x86_64-linux-gnu/
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the app with clang 15
        run: npm run build:app
      - name: Test the app (under xvfb-run)
        run: npm run test:app

  # One stable check name for branch protection to require, however many jobs exist above.
  passed:
    name: CI passed
    if: always()
    needs: [session-model-spike, relay-spike, sample-index-spike, sample-transfer-spike, plugin-inventory-spike, changes, engine-toolchain-spike, webview-ui-spike, plugin-params-rules, plugin-params-spike, engine-projection-ts, engine-projection-spike, shell-scripts, workspace, app, app-clang-15]
    runs-on: ubuntu-latest
    steps:
      # Each check exits on its own: under "bash -e", a failure inside "a || { b && c; }"
      # does not stop the script, so only the last such line used to decide the result.
      - name: Fail unless every job succeeded
        run: |
          # A job may be skipped, but only because change detection succeeded and said so.
          must_pass() {
            test "$2" = "success" || { echo "::error::$1 was $2"; exit 1; }
          }
          may_skip() {
            test "$2" = "success" && return 0
            test "$2" = "skipped" && test "$3" = "false" && return 0
            echo "::error::$1 was $2 (change detection said run=$3)"
            exit 1
          }
          must_pass changes "${{ needs.changes.result }}"
          must_pass workspace "${{ needs.workspace.result }}"
          may_skip app "${{ needs.app.result }}" "${{ needs.changes.outputs.app }}"
          may_skip app-clang-15 "${{ needs.app-clang-15.result }}" "${{ needs.changes.outputs.app }}"
          spikes="${{ needs.changes.outputs.spikes }}"
          may_skip session-model-spike "${{ needs.session-model-spike.result }}" "$spikes"
          may_skip relay-spike "${{ needs.relay-spike.result }}" "$spikes"
          may_skip sample-index-spike "${{ needs.sample-index-spike.result }}" "$spikes"
          may_skip sample-transfer-spike "${{ needs.sample-transfer-spike.result }}" "$spikes"
          may_skip plugin-inventory-spike "${{ needs.plugin-inventory-spike.result }}" "$spikes"
          may_skip engine-projection-ts "${{ needs.engine-projection-ts.result }}" "$spikes"
          may_skip shell-scripts "${{ needs.shell-scripts.result }}" "$spikes"
