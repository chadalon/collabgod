<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CollabGod</title>
    <link rel="icon" href="data:," />
    <!--
      The background is the contract's backgroundColour (packages/bridge/src/contract.ts),
      which the web view and the window use too; test/page.test.ts checks they match.
      It is inline so it applies before anything else loads.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        color: #d8dde8;
        font: 13px system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #surface {
        display: block;
        width: 100%;
        height: 100%;
      }
      #diagnostics {
        position: fixed;
        right: 12px;
        bottom: 12px;
        margin: 0;
        padding: 10px 12px;
        max-width: calc(100% - 48px);
        background: rgb(20 23 31 / 92%);
        border: 1px solid #262b38;
        border-radius: 6px;
        font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        user-select: text;
      }
      /* The audio settings (#27), until the design system (#33) restyles them. */
      #audio-button {
        position: fixed;
        top: 12px;
        right: 12px;
        font: inherit;
      }
      #audio {
        position: fixed;
        top: 44px;
        right: 12px;
        width: 340px;
        padding: 12px 14px;
        background: rgb(20 23 31 / 96%);
        border: 1px solid rgb(38 43 56);
        border-radius: 6px;
      }
      #audio h2 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      #audio label {
        display: grid;
        grid-template-columns: 110px 1fr;
        align-items: center;
        margin: 6px 0;
      }
      #audio select {
        min-width: 0;
        font: inherit;
      }
      #audio .message {
        color: rgb(240 190 90);
      }
      #audio .state.none {
        color: rgb(240 120 110);
      }
      #audio .hint {
        color: rgb(140 148 165);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="surface"></canvas>
    <pre id="diagnostics" hidden></pre>
    <button id="audio-button" type="button" title="Audio settings (Ctrl+, or Cmd+,)">Audio</button>
    <section id="audio" hidden></section>
    <script type="module" src="app.js"></script>
  </body>
</html>
